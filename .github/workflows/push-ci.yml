name: push ci
on:
  push:
    branches:
    - "**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.env.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        env:
        # - runs-on: macos-15
        # - runs-on: macos-14
        - runs-on: ubuntu-24.04
        # - runs-on: windows-2022
        # - runs-on: windows-2025

    steps:
    - name: checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: setup rust
      run: rustc --version

    - name: build
      run: cargo build --verbose

    - name: test
      run: cargo test --verbose --target wasm32-unknown-unknown
