name: push ci
on:
  push:
    branches:
    - "**"
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: push-ci-${{ github.event.ref }}

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -Ccodegen-units=1 -Cdebuginfo=full -Cinstrument-coverage -Clink-dead-code -Cllvm-args=--inline-threshold=0

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        runs-on:
        - macos-26
        # - ubuntu-26.04
        - ubuntu-26.04-arm
        # - windows-2025
        # - windows-11-arm

    steps:
    - name: checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # - name: cache rust install
    #   uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    #   with:
    #     path: key here
    #     key: key here

    - name: setup rust
      run: rustc --version

    - name: install wasm-bindgen-cli
      run: cargo install wasm-bindgen-cli
      env:
        # for CI use, optimise more for compilation speed rather than runtime speed
        # could probably be made more optimal
        RUSTFLAGS: -Clto=off -Copt-level=1 -Ccodegen-units=1024 -Cpanic=unwind -Zthreads=8

    - name: build
      run: cargo build --verbose

    - name: test
      run: cargo test --verbose
      env:
        LLVM_PROFILE_FILE: "target/coverage/test-%m-%p.profraw"

    - name: fetch/run grcov
      run: |
        case $RUNS_ON in
          macos-26)
            curl -Lo grcov.bz2 https://github.com/mozilla/grcov/releases/download/v0.10.8/grcov-aarch64-apple-darwin.tar.bz2
            tar xvf grcov.bz2
            rm grcov.bz2
            ;;

          # ubuntu-26.04)
          #   ;;

          ubuntu-26.04-arm)
            curl -Lo grcov.bz2 https://github.com/mozilla/grcov/releases/download/v0.10.8/grcov-aarch64-unknown-linux-musl.tar.bz2
            tar xvf grcov.bz2
            rm grcov.bz2
            ;;

          # windows-2025)
          #   ;;

          # windows-11-arm)
          #   ;;

          *)
            echo runner not accounted for
            exit 1
            ;;
        esac

        ./grcov . --source-dir . --output-types lcov --binary-path ./target/debug/ --branch --ignore-not-existing --output-path ./target/coverage/tests.lcov
      env:
        RUNS_ON: ${{ matrix.runs-on }}

    - name: upload to codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: target/coverage/*.lcov
        token: ${{ secrets.CODECOV_TOKEN }}

  clippy:
    uses: ./.github/workflows/clippy.yml

  docs:
    needs:
    - test
    # TODO enable when existing warnings have been cleared
    # - clippy
    runs-on: ubuntu-24.04

    steps:
    - name: checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: setup rust
      run: rustc --version

    # - name: cache rust install
    #   uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    #   with:
    #     path: key here
    #     key: key here

    - name: install fish shell
      run: |
        sudo add-apt-repository -yn ppa:fish-shell/release-4
        sudo apt-get update
        sudo apt-get install fish

    - name: generate docs
      shell: fish {0}
      run: |
        set -gx RUSTDOCFLAGS "--cfg docsrs --cfg kiwingay -Z unstable-options --enable-index-page --theme "(pwd)"/.cargo/rustdoc-custom-theme/meadow.css"
        set -gx KIWINGAY_DEPLOY_COMMIT_SHORT (string sub --length 8 $KIWINGAY_DEPLOY_COMMIT)
        cargo doc --verbose --no-deps --lib
      env:
        KIWINGAY_DEPLOY_COMMIT: ${{ github.sha }}

    - name: checkout gh-pages branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: gh-pages
        ref: gh-pages

    - name: deploy docs
      shell: fish {0}
      run: |
        rm -rf gh-pages/*
        mv gh-pages/.git gh-pages/git
        rm -rf gh-pages/.*
        mv gh-pages/git gh-pages/.git

        cp -R target/doc/* gh-pages
        cp -R target/doc/.* gh-pages
        cp .gitignore gh-pages/.gitignore
        touch gh-pages/.nojekyll
        echo wiwi.kiwin.gay > gh-pages/CNAME

        set COMMIT_MESSAGE "(automated) deploy from commit "(git rev-parse HEAD)

        cd gh-pages

        git config --global user.name "smol"
        git config --global user.email "107521333+a-tiny-kirin@users.noreply.github.com"

        git add -A
        git commit -m "$COMMIT_MESSAGE" --allow-empty
        git push
