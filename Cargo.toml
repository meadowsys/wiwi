[workspace]
resolver = "3"
members = [
	"packages/macro-decl",
	"packages/macro-proc",
	"packages/wasm",
	"packages/wiwi",
	"scripts"
]

[workspace.package]
version = "0.11.0-pre.2"
edition = "2021"
rust-version = "1.85"
authors = ["Meadowsys <meadowsys@kiwin.gay>"]
repository = "https://github.com/meadowsys/wiwi"
license = "MIT"

[workspace.dependencies]
wiwi = { path = "packages/wiwi" }
wiwiwiwiwi = { path = "packages/macro-proc", version = "=0.11.0-pre.2" }
wiwiwiwiwiwiwiwiwiwi = { path = "packages/macro-decl", version = "=0.11.0-pre.2" }

cfg-if = "1.0.0"
chrono = { version = "0.4.38", features = ["clock"] }
criterion = { version = "0.5.1", features = ["html_reports"] }
darling = "0.20.10"
hashbrown = { version = "0.15.0", features = ["default-hasher"] }
hex = "0.4.3"
home = "0.5.9"
parking_lot = "0.12.3"
proc-macro2 = "1.0.83"
quote = "1.0.36"
rand = "0.8.5"
syn = "2.0.66"
thiserror = { version = "1.0.69" }
tokio = { version = "1.41.1", features = ["full"] }
z85 = "3.0.5"

[workspace.lints.rust]
# missing_docs = "warn"
unconditional_recursion = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kiwingay)"] }
unfulfilled_lint_expectations = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_unsafe = "warn"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_conversions = "warn"
empty_docs = "warn"
inline_always = "warn"
items_after_statements = "warn"
items_after_test_module = "warn"
# missing_docs_in_private_items = "warn"
missing_inline_in_public_items = "warn"
missing_safety_doc = "warn"
mixed_attributes_style = "warn"
multiple_unsafe_ops_per_block = "warn"
trait_duplication_in_bounds = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_lazy_evaluations = "allow"
unnecessary_safety_comment = "warn"
