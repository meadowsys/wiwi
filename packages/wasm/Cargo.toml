[package]
name = "wiwi-wasm"
description = "Nicer, higher level APIs for working with JavaScript from Rust (WASM), mostly revolving around builder-style APIs"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[dependencies]
wasm-bindgen = { version = "0.2.100", default-features = false, features = ["msrv"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.50"

[features]
std = [
	"wasm-bindgen/std"
]

[lints]
workspace = true

[package.metadata.docs.rs]
# https://docs.rs/about/metadata

# https://users.rust-lang.org/t/how-to-document-optional-features-in-api-docs/64577
rustdoc-args = ["--cfg", "docsrs"]

features = [
	"std"
]

targets = [
	"wasm32-unknown-unknown",
	"wasm32-wasip2",
	"aarch64-apple-darwin"
]
